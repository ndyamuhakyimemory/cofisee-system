
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COFISEE Microfinance - Members</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f2f5f9;margin:0;color:#17243a}
header{background:#073763;color:white;padding:20px;text-align:center}
main{max-width:850px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;margin-bottom:18px;border-radius:10px;box-shadow:0 2px 8px #ccc}
input,button,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #bbb;border-radius:5px}
button{background:#07569b;color:white;border:0;font-weight:bold;cursor:pointer}
button.danger{background:#b52b35}
small{color:#555}
table{width:100%;border-collapse:collapse}
th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}
.table-wrap{overflow-x:auto}
#app{display:none}
</style>
</head>
<body>
<header>
<h2>COFISEE MICROFINANCE</h2>
<p>Member Registration and Management</p>
</header>

<main>
<section class="card">
<h3>Connect Online Database</h3>
<input id="projectUrl" placeholder="Paste Supabase Project URL">
<input id="publicKey" placeholder="Paste Supabase Publishable Key">
<button onclick="connectDatabase()">Connect Database</button>
<small id="connectionMessage">Enter your Project URL and Publishable Key.</small>
</section>

<section class="card">
<h3>Staff Login</h3>
<input id="email" type="email" placeholder="Staff email address">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Sign In</button>
<button onclick="logout()" class="danger">Sign Out</button>
<p id="loginMessage"></p>
</section>

<div id="app">
<section class="card">
<h3>Register New Member</h3>
<form id="memberForm">
<input id="name" placeholder="Full name" required>
<input id="phone" placeholder="Phone number" required>
<input id="nationalId" placeholder="National ID number" required>
<input id="registrationDate" type="date" required>
<select id="status">
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
</select>
<button type="submit">Save Member</button>
<button type="button" onclick="resetForm()" class="danger">Clear Form</button>
</form>
<p id="formMessage"></p>
</section>

<section class="card">
<h3>Registered Members</h3>
<input id="search" placeholder="Search by name, member number or phone" oninput="displayMembers()">
<button onclick="loadMembers()">Refresh Members</button>
<p id="count"></p>
<div class="table-wrap">
<table>
<thead><tr>
<th>Member No.</th><th>Name</th><th>Phone</th><th>National ID</th><th>Status</th><th>Action</th>
</tr></thead>
<tbody id="memberRows"></tbody>
</table>
</div>
</section>
</div>
</main>

<script>
let db = null;
let members = [];
let editingId = null;

function connectDatabase(){
 const url=document.getElementById('projectUrl').value.trim();
 const key=document.getElementById('publicKey').value.trim();
 if(!url || !key){
  document.getElementById('connectionMessage').textContent='Enter both database details.';
  return;
 }
 try{
  db=window.supabase.createClient(url,key);
  localStorage.setItem('cofisee_url',url);
  localStorage.setItem('cofisee_key',key);
  document.getElementById('connectionMessage').textContent='Database client ready. Please sign in.';
 }catch(e){
  document.getElementById('connectionMessage').textContent='Connection setup failed: '+e.message;
 }
}

async function login(){
 if(!db){connectDatabase();if(!db)return;}
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){
  document.getElementById('loginMessage').textContent=error.message;
  return;
 }
 document.getElementById('loginMessage').textContent='Signed in successfully.';
 document.getElementById('app').style.display='block';
 await loadMembers();
}

async function logout(){
 if(db) await db.auth.signOut();
 document.getElementById('app').style.display='none';
 document.getElementById('loginMessage').textContent='You have signed out.';
}

async function loadMembers(){
 if(!db)return;
 const {data,error}=await db.from('members')
  .select('id,member_no,name,phone,national_id,registration_date,status')
  .order('created_at',{ascending:false});
 if(error){
  alert('Could not load members: '+error.message);
  return;
 }
 members=data||[];
 displayMembers();
}

function displayMembers(){
 const q=document.getElementById('search').value.toLowerCase();
 const filtered=members.filter(m=>
  [m.member_no,m.name,m.phone,m.national_id].some(v=>(v||'').toLowerCase().includes(q))
 );
 document.getElementById('count').textContent='Total displayed: '+filtered.length;
 document.getElementById('memberRows').innerHTML=filtered.map(m=>`
 <tr>
 <td>${escapeHTML(m.member_no)}</td>
 <td>${escapeHTML(m.name)}</td>
 <td>${escapeHTML(m.phone)}</td>
 <td>${escapeHTML(m.national_id)}</td>
 <td>${escapeHTML(m.status)}</td>
 <td>
 <button onclick="editMember('${m.id}')">Edit</button>
 <button class="danger" onclick="deleteMember('${m.id}')">Delete</button>
 </td>
 </tr>`).join('');
}

function escapeHTML(value){
 return String(value??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

document.getElementById('memberForm').addEventListener('submit',async function(e){
 e.preventDefault();
 if(!db){alert('Connect the database first.');return;}
 const {data:{user}}=await db.auth.getUser();
 if(!user){alert('Please sign in first.');return;}
 const record={
  name:document.getElementById('name').value.trim(),
  phone:document.getElementById('phone').value.trim(),
  national_id:document.getElementById('nationalId').value.trim(),
  registration_date:document.getElementById('registrationDate').value,
  status:document.getElementById('status').value
 };
 let result;
 if(editingId){
  result=await db.from('members').update(record).eq('id',editingId);
 }else{
  record.created_by=user.id;
  result=await db.from('members').insert(record);
 }
 if(result.error){
  document.getElementById('formMessage').textContent='Error: '+result.error.message;
  return;
 }
 document.getElementById('formMessage').textContent=editingId?'Member updated.':'Member registered successfully.';
 resetForm();
 await loadMembers();
});

function editMember(id){
 const m=members.find(x=>x.id===id);
 if(!m)return;
 editingId=id;
 document.getElementById('name').value=m.name;
 document.getElementById('phone').value=m.phone;
 document.getElementById('nationalId').value=m.national_id;
 document.getElementById('registrationDate').value=m.registration_date;
 document.getElementById('status').value=m.status;
 document.getElementById('formMessage').textContent='Editing '+m.member_no;
 window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteMember(id){
 if(!confirm('Are you sure you want to delete this member?'))return;
 const {error}=await db.from('members').delete().eq('id',id);
 if(error){alert(error.message);return;}
 await loadMembers();
}

function resetForm(){
 editingId=null;
 document.getElementById('memberForm').reset();
 document.getElementById('formMessage').textContent='';
}

window.addEventListener('load',()=>{
 const url=localStorage.getItem('cofisee_url');
 const key=localStorage.getItem('cofisee_key');
 if(url)document.getElementById('projectUrl').value=url;
 if(key)document.getElementById('publicKey').value=key;
 if(url&&key){
  db=window.supabase.createClient(url,key);
  document.getElementById('connectionMessage').textContent='Database details loaded. Please sign in.';
 }
});
</script>
</body>
</html>
